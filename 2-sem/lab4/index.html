<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ASD lab3</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap");
      body {
        font-family: "Poppins", sans-serif;
        background-color: pink;
        color: white;
        display: flex;
        justify-content: center;
      }
      .container {
        text-align: center;
      }
      #canvas {
        display: flex;
        background-color: white;
      }
      .buttons {
        display: flex;
        justify-content: center;
      }
      .btn {
        margin: 10px;
        background-color: hotpink;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        padding: 10px;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>Variant: 5311</p>
      <div class="canvas">
        <div class="buttons">
          <button class="btn" onclick="drawDirected()">Directed</button>
          <button class="btn" onclick="drawUndirected()">Undirected</button>
          <button class="btn" onclick="drawModified()">Modified</button>
          <button class="btn" onclick="drawCondense()">Condense</button>
        </div>
        <canvas id="canvas" width="500" height="500"></canvas>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
